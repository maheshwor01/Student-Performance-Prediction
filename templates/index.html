<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h1 class="text-center text-primary mb-4">
            🎓 Student Performance Prediction
        </h1>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Hours Studied</label>
                    <input type="number" class="form-control" name="Hours_Studied" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Attendance</label>
                    <input type="number" class="form-control" name="Attendance" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Parental Involvement</label>
                    <input type="number" class="form-control" name="Parental_Involvement" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Access to Resources</label>
                    <input type="number" class="form-control" name="Access_to_Resources" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Extracurricular Activities</label>
                    <input type="number" class="form-control" name="Extracurricular_Activities" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Sleep Hours</label>
                    <input type="number" class="form-control" name="Sleep_Hours" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Previous Scores</label>
                    <input type="number" class="form-control" name="Previous_Scores" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Motivation Level</label>
                    <select class="form-control" name="Motivation_Level" required>
                        <option value="">Select Motivation</option>
                        <option value="2">High</option>
                        <option value="1">Medium</option>
                        <option value="0">Low</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Internet Access</label>
                    <select class="form-control" name="Internet_Access" required>
                        <option value="">Select</option>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Tutoring Sessions</label>
                    <input type="number" class="form-control" name="Tutoring_Sessions" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Family Income</label>
                    <input type="number" class="form-control" name="Family_Income" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Teacher Quality</label>
                    <input type="number" class="form-control" name="Teacher_Quality" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>School Type</label>
                    <select class="form-control" name="School_Type" required>
                        <option value="">Select</option>
                        <option value="0">Public</option>
                        <option value="1">Private</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Peer Influence</label>
                    <input type="number" class="form-control" name="Peer_Influence" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Physical Activity</label>
                    <input type="number" class="form-control" name="Physical_Activity" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Learning Disabilities</label>
                    <input type="number" class="form-control" name="Learning_Disabilities" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Parental Education Level</label>
                    <input type="number" class="form-control" name="Parental_Education_Level" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Distance from Home</label>
                    <input type="number" class="form-control" name="Distance_from_Home" required>
                </div>

               <div class="col-md-6 mb-3">
                 <label>Gender</label>
                  <select class="form-control" name="Gender" required>
                     <option value="">Select Gender</option>
                     <option value="1">Male</option>
                     <option value="0">Female</option>
                    </select>
                </div>

            </div>

            <div class="text-center mt-3">
                <button class="btn btn-primary btn-lg">
                    Predict Score
                </button>
            </div>

        </form>

        {% if prediction_text %}
        <div class="alert alert-success text-center mt-4">
            <h3>{{ prediction_text }}</h3>
        </div>
        {% endif %}

    </div>

</div>

</body>
</html>
